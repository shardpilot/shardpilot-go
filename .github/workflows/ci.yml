name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.24.x'
          - '1.26.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  release-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version consistency (README latest tag == CHANGELOG head == skill pin)
        run: ./scripts/check_release_consistency.sh

  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ⚠ fetch-depth: 0. The gate's roster rule asks whether each literal
      # internal name already appears in this repository's PUBLISHED history,
      # and actions/checkout defaults to a ONE-COMMIT clone. On that clone every
      # literal reads as novel, so the gate refuses with exit 2 and blames the
      # roster for a property of the checkout. Verified by cloning this branch
      # with --depth 1 and running the gate: exit 2, "shallow checkout".
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This repository is already public, so it is NOT in the org's
      # publication-candidate list and nothing else scans it. See the script's
      # header for what the two lanes do and do not cover.
      - name: No internal material in the published non-source surface
        run: ./scripts/check_public_surface.sh
