name: ci

on:
  pull_request:
  # ⚠ EVERY PUSH, NOT ONLY main. This repository is PUBLIC: a branch pushed here
  # is readable the moment it lands, whether or not a pull request ever opens.
  # A `branches: [main]` filter meant the secret scan skipped exactly the case
  # where the contents are already exposed and nobody is looking. Tags are included for the same reason and a stronger one — a tag
  # is the artifact people install, and one release here was cut off-main.
  #
  # No job is conditioned to narrow this back down. A condition is how a gate
  # stops running without anyone noticing, which is the failure being fixed; the
  # cost of running the rest of the suite on a branch push is CI minutes.
  push:

# ⚠ NO WORKFLOW-LEVEL CONCURRENCY, DELIBERATELY. `cancel-in-progress` at this
# level cancels the run for a superseded push — which is exactly the disclosure
# case: a branch pushed with a credential and force-pushed a minute later. The
# cancelled run never scanned the commit that was public, and the replacement
# run checks out history in which that commit is no longer reachable, so not
# even the `--log-opts=--all` pass can reach it. Cancelling a security scan on
# the grounds that a newer commit exists is cancelling it for the one push that
# mattered.
#
# So the publication-sensitive jobs carry no concurrency group at all and always
# run to completion. The rest opt in per job, keyed by job as well as ref so
# they do not queue behind one another.

jobs:
  # Workspace security baseline, mirroring the pattern the other SDK
  # repositories already run (godot/unity/unreal/cli). Both passes: the working
  # tree and the full history across all refs, so a secret can neither live at
  # HEAD nor hide in an earlier commit. Exact-pinned image.
  #
  # There IS a .gitleaks.toml here, and it carries no `paths` clause on purpose:
  # measured against v8.30.1, an allowlist with `paths` excuses the whole FILE
  # even with condition = "AND", and the files needing exceptions are test files
  # — the likeliest place for a pasted credential. Exceptions name the literal.
  #
  # ⚠ THIS REPOSITORY IS PUBLIC, which inverts the usual urgency. Everywhere
  # else a missing secret scan is a gap to close before a visibility flip; here
  # a credential is exposed at the moment it is pushed. It was measured on
  # 2026-08-20 that this was one of only two candidate repositories running no
  # secret scanner at all — and the only two already public.
  #
  # fetch-depth: 0 is required by the history pass and by nothing else in this
  # workflow.
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch pull-request refs for the history scan
        run: git fetch origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan working tree for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --verbose --redact /github/workspace

      - name: Scan git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --verbose --redact --log-opts=--all /github/workspace
  go:
    runs-on: ubuntu-latest
      # ⚠ THE MATRIX AXIS IS PART OF THE GROUP. Without it every leg of the
      # matrix shares one group, and `cancel-in-progress` has the legs cancel
      # each other as they start — leaving one runtime tested and the others
      # reported as nothing at all. A gate that silently drops legs is the
      # failure this whole change is about.
    concurrency:
      # ⚠ A LITERAL JOB NAME, NOT `github.job`. That context is not populated
      # when the group is evaluated, so every job sharing an event and a ref
      # collapsed into ONE group and they cancelled each other — one gate lost
      # per run, whichever started second. It was visible as a single cancelled
      # check with no competing run to explain it.
      # ⚠ THE EVENT IS PART OF THE GROUP. A push and a pull_request run on the
      # same commit are different work to CI, and without it they cancelled
      # each other — leaving a cancelled check on the pull request, which reads
      # as a failure and blocks the merge it was never about.
      group: ${{ github.workflow }}-${{ github.event_name }}-go-${{ matrix.go-version }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.25.x'
          - '1.27.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  # gofmt is checked ONCE, on the newest toolchain this repo tests, and
  # deliberately NOT inside the version matrix.
  #
  # gofmt's output changes between Go releases: 1.27 de-indents the
  # continuation lines of a multi-value return whose operands are composite
  # literals, which 1.25 indents. A source file therefore cannot satisfy
  # 1.25's gofmt and 1.27's at the same time, and running the check on every
  # matrix leg asserts precisely that impossibility — it turned this workflow
  # red the moment 1.27.x joined the matrix.
  #
  # The newest toolchain wins because that is what contributors have installed.
  # Formatting is not a compatibility constraint: it has no bearing on what the
  # 1.25 baseline can compile, which is what the matrix is actually for.
  format:
    runs-on: ubuntu-latest
    concurrency:
      # ⚠ A LITERAL JOB NAME, NOT `github.job`. That context is not populated
      # when the group is evaluated, so every job sharing an event and a ref
      # collapsed into ONE group and they cancelled each other — one gate lost
      # per run, whichever started second. It was visible as a single cancelled
      # check with no competing run to explain it.
      # ⚠ THE EVENT IS PART OF THE GROUP. A push and a pull_request run on the
      # same commit are different work to CI, and without it they cancelled
      # each other — leaving a cancelled check on the pull request, which reads
      # as a failure and blocks the merge it was never about.
      group: ${{ github.workflow }}-${{ github.event_name }}-format-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  # The committed benchmarks, SHOWN EXECUTING. They lived in this repository
  # unrun, which makes them a file rather than a measurement — and they rot as
  # silently as an unrun test would.
  #
  # The script, not a bare `go test -bench`, because `go test -bench .` EXITS 0
  # when it matches no benchmarks: a rename or a build tag leaves such a step
  # green over zero measurements. The script establishes what is supposed to
  # run, asserts each one reported, and names anything that did not.
  #
  # Its own job, on ONE toolchain, deliberately NOT inside the version matrix —
  # the same shape the gofmt job above uses, for a related reason. The numbers
  # measure this code, not the toolchain, so publishing one set per matrix leg
  # invites a comparison between runners that nothing here controls.
  #
  # A job rather than a matrix leg guarded by `if: matrix.go-version == '…'`,
  # which is how this was first written and is a trap: when the matrix moved
  # from 1.26.5 to 1.27.x, that condition matched nothing and the benchmarks
  # would have stopped running with the workflow still green. A check that a
  # version bump can silently switch off is the failure this script exists to
  # refuse; it should not be reintroduced by the way the script is invoked.
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: Benchmarks
        run: scripts/run_benchmarks.sh bench/latest.txt

      # Published so the numbers are readable without opening a log, which is
      # what makes them evidence somebody can cite rather than something that
      # scrolled past.
      - name: Publish benchmark results
        run: |
          {
            echo '### Benchmarks'
            echo
            echo '```'
            cat bench/latest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench/latest.txt
          retention-days: 30

  # ── THE CHANGE MAY NOT SUPPLY THE GATE THAT JUDGES IT ────────────────────────
  #
  # Every gate below runs as `./scripts/<name>.sh` out of the checkout being
  # judged, so a change could ship a modified gate in the same commit and be
  # judged by it. CI is the authoritative place for that to fail: a pre-push hook
  # asserting the same thing is advisory, because `--no-verify` removes it
  # (shardpilot/shardpilot-go#97).
  #
  # WHAT IS JUDGED: every tracked path under scripts/ -- the gate scripts, the Go
  # helpers they `go run`, the benchmark manifest and the lane B baseline are all
  # inputs to a decision -- plus every shell script this workflow invokes by path
  # (a slash and `.sh`), wherever it lives. Both are read at the change's BASE as
  # well as at its head. The first version read the roster from the change's own
  # copy of this file, which is the change supplying its judge's roster: a gate
  # moved out of scripts/, weakened, with its invocation edited to match, left
  # the roster and passed. Measured, not reasoned, before this was rewritten.
  #
  # AGAINST WHAT: the change's own base, chosen by event -- the pull request's
  # base commit, the pre-push tip, or for a brand-new ref the merge base with the
  # default branch. The first version took that merge base for every event, and
  # round 1 found it wrong twice. A push to the default branch has merge base
  # HEAD, so the change was diffed against itself and passed -- and measured
  # 2026-09-01, 113 of the 184 commits on main carry no pull-request number, 26
  # of those touched scripts/: that is the path gate changes took here. And a
  # pull request into a non-default branch reached back to main, so the target
  # branch's own gate change was charged to every pull request into it.
  #
  # ⚠ THIS JOB DOES NOT CLOSE THE WHOLE CLASS, AND THAT IS SAID HERE RATHER THAN
  # FURTHER DOWN. GitHub runs the CHANGE'S copy of this file on both triggers --
  # the branch's on `push`, the merge commit's on `pull_request` -- so a change
  # can delete this job, or keep its name and hollow it out. A required status
  # check closes the deletion (a missing check blocks the merge) and not the
  # hollowing; only a job run from a workflow the change cannot edit closes both
  # -- `pull_request_target` in its own workflow file, or a ruleset requiring a
  # workflow pinned to the default branch. Every one of those is a repository
  # setting rather than anything a file can assert. A reader who implements
  # this and stops has closed the script routes and left the workflow route
  # silent, which is the mistake #97 documents.
  #
  # ⚠ A GATE CHANGE IS RED HERE BY DESIGN. Measured 2026-09-01: 35 of the 184
  # commits then on main touched a gate script, and each would have failed this
  # job -- each was a change to a judge, and the refusal asks a human to read it
  # as one. With this job a required check, such a change merges only through
  # the bypass list; that is the review, not a way around it.
  #
  # ⚠ VERIFY, NOT SUBSTITUTE, AND THE REASON WAS MEASURED. Running the gate from a
  # trusted checkout looks stronger and is worse: `check_public_surface.sh` does
  # `cd "$(dirname "$0")/.."`, so a copy invoked from a trusted directory scans
  # THAT directory -- it would audit the default branch, report clean, and never
  # look at the change under review. A gate reporting green while checking nothing
  # is the defect this job exists to prevent, so the gate is compared, not moved.
  gate-integrity:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-gate-integrity-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 5

    steps:
      - name: Checkout
        # Full history: the comparison needs the change's base commit, and for a
        # new ref its merge base with the default branch.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: A change may not alter the gate that judges it
        # Plain variables rather than `${{ }}` inside the script, so the block can
        # be extracted from this file and driven through every event shape by a
        # fixture that sets these four names. That is how the rows in the pull
        # request were produced.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # `-e` is spelled out because the runner adds it anyway (`bash -e {0}`).
          # The first version said `set -uo pipefail`, its controls were run under
          # plain bash, and in CI the branch refusing an empty roster was
          # unreachable: the failing pipeline exited 1 with no message.
          set -euo pipefail
          wf=.github/workflows/ci.yml
          zero=0000000000000000000000000000000000000000

          # ⚠ THE CHANGE'S OWN BASE, BY EVENT. `git merge-base HEAD <default tip>`
          # is right for a brand-new ref and wrong for the two events that matter
          # most: on a push to the default branch it IS HEAD, so a direct push
          # altering a gate was diffed against itself and passed; on a pull
          # request into a non-default branch it reaches back to main, so the
          # target branch's own gate change was charged to every pull request
          # into it. Both found by round 1 on shardpilot/shardpilot-go#101.
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"; what="the pull request's base commit"
              if [ -z "$base" ]; then
                echo "REFUSING: a pull_request event without a base sha; nothing to" >&2
                echo "  compare against, and this job will not guess one." >&2
                exit 2
              fi ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero" ]; then
                base="$PUSH_BEFORE"; what="the pre-push tip"
              else
                base=""; what="the merge base with origin/$DEFAULT_BRANCH"
              fi ;;
            *)
              echo "REFUSING: event '$EVENT_NAME' -- this job knows the change's base" >&2
              echo "  only for push and pull_request, and will not guess one." >&2
              exit 2 ;;
          esac
          if [ -z "$base" ]; then
            if ! git fetch --no-tags --quiet origin "$DEFAULT_BRANCH"; then
              echo "REFUSING: origin/$DEFAULT_BRANCH could not be fetched, so there is" >&2
              echo "  nothing to compare against. A comparison that cannot run is" >&2
              echo "  reported here rather than passed over." >&2
              exit 2
            fi
            base="$(git merge-base HEAD FETCH_HEAD)" || base=""
            if [ -z "$base" ]; then
              echo "REFUSING: no merge base with origin/$DEFAULT_BRANCH, so which side" >&2
              echo "  changed a gate could not be decided." >&2
              exit 2
            fi
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # A force-push leaves the old tip reachable from no ref. Fetching it by
            # sha works while GitHub still holds the object; when it does not, the
            # refusal costs a re-run, where a pass would cost a miss.
            if ! git fetch --no-tags --quiet origin "$base" 2>/dev/null \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "REFUSING: $what ($base) is not available here, so there is" >&2
              echo "  nothing to compare against." >&2
              exit 2
            fi
          fi

          # The roster is DERIVED from this workflow, not listed: every shell
          # script it invokes by path -- a slash and `.sh`, in any directory --
          # read from the base's copy as well as the head's, so the change cannot
          # edit a gate out of it. The grep is guarded: under -e a miss would
          # otherwise end the script before the refusal below could name it.
          # ⚠ Outside the roster, stated: a gate that is not a `.sh` path (a
          # `go run` target, an inline step) and does not live under scripts/.
          derive() { { grep -oE '(\./)?[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+\.sh' || :; } | sed 's|^\./||' | sort -u; }
          if ! git cat-file -e "$base:$wf" 2>/dev/null; then
            echo "REFUSING: $wf does not exist at the base $base, so the roster" >&2
            echo "  this job judges against could not be read." >&2
            exit 2
          fi
          from_base="$(git show "$base:$wf" | derive)"
          from_head=""
          if [ -f "$wf" ]; then from_head="$(derive < "$wf")"; fi
          if [ -z "$from_base" ] || [ -z "$from_head" ]; then
            echo "REFUSING: no gate script invocation was found in $wf" >&2
            echo "  (base: ${from_base:-none}; head: ${from_head:-none}), so this" >&2
            echo "  check would compare nothing and report success. The pattern" >&2
            echo "  here has stopped matching how the workflow runs its gates." >&2
            exit 2
          fi
          tree_base="$(git ls-tree -r --name-only "$base" -- scripts/)"
          tree_head="$(git ls-files -- scripts/)"
          judges="$(printf '%s\n%s\n%s\n%s\n' "$from_base" "$from_head" "$tree_base" "$tree_head" | sed '/^$/d' | sort -u)"

          changed=""
          n=0
          while IFS= read -r g; do
            [ -n "$g" ] || continue
            n=$((n + 1))
            if ! git diff --quiet "$base" -- "$g"; then
              changed="$changed    $g"$'\n'
            fi
          done <<EOF
          $judges
          EOF

          if [ -z "$changed" ]; then
            printf 'this change does not alter any of the %d gate file(s) that judge it (base: %s).\n' "$n" "$what"
            exit 0
          fi

          echo "REFUSING: this change alters the gate that judges it (base: $what)." >&2
          echo >&2
          printf '%s' "$changed" >&2
          echo >&2
          echo '  A change may not supply its own judge. CI is the authoritative' >&2
          echo '  place to hold that: a pre-push hook asserting it is advisory,' >&2
          echo '  because `--no-verify` removes it.' >&2
          echo >&2
          echo '  This is EXPECTED for a deliberate gate change, and it is red on' >&2
          echo '  purpose: a gate that can be weakened without review is not a gate.' >&2
          echo '  Land such a change on its own terms, reviewed AS a change to the' >&2
          echo '  gate rather than carried alongside the work it would judge. If this' >&2
          echo '  job is a required check, that review is the bypass list.' >&2
          echo >&2
          echo "  ⚠ AND THIS DOES NOT CLOSE THE WHOLE CLASS: GitHub runs the change's" >&2
          echo '  own copy of this workflow on both triggers, so a change can delete' >&2
          echo '  or hollow out this job rather than fail it. Only a repository' >&2
          echo '  setting closes that. See shardpilot/shardpilot-go#97.' >&2
          exit 1

  release-consistency:
    runs-on: ubuntu-latest
    concurrency:
      # ⚠ A LITERAL JOB NAME, NOT `github.job`. That context is not populated
      # when the group is evaluated, so every job sharing an event and a ref
      # collapsed into ONE group and they cancelled each other — one gate lost
      # per run, whichever started second. It was visible as a single cancelled
      # check with no competing run to explain it.
      # ⚠ THE EVENT IS PART OF THE GROUP. A push and a pull_request run on the
      # same commit are different work to CI, and without it they cancelled
      # each other — leaving a cancelled check on the pull request, which reads
      # as a failure and blocks the merge it was never about.
      group: ${{ github.workflow }}-${{ github.event_name }}-release-consistency-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version consistency (README latest tag == CHANGELOG head == skill pin)
        run: ./scripts/check_release_consistency.sh
  # ⚠ ITS OWN JOB, WITH ITS OWN CLOCK, AND THE REASON IS ARITHMETIC. The harness
  # clones HEAD once, then drives each refusal by running the WHOLE gate once per
  # control, so its cost is controls x gate-cost. Measured in this workflow on
  # 2026-08-27/28, eight runs at the construction that ships here, harness step
  # only, as SECONDS PER CONTROL -- which is the quantity that holds still:
  #
  #   27 controls   242s, 245s              9.0, 9.1
  #   28 controls   229s, 230s, 254s, 255s  8.2, 8.2, 9.1, 9.1
  #   29 controls   283s                    9.8
  #   33 controls   259s, 311s              7.9, 9.4
  #
  # -- 7.9 to 9.8 seconds per control, and the total is that times the count.
  #
  # ⚠ RECORDED PER CONTROL BECAUSE A TOTAL KEEPS BEING FALSIFIED BY ITS OWN
  # SUCCESS. This comment first crowned one run the slowest; the next run beat
  # it. It then recorded a band of totals, 229-283s; the next run after that
  # measured 311s -- not because the job got slower but because the harness
  # gained four controls, which is the thing this job is FOR. A figure that a
  # later measurement can falsify does not belong in a file, and a total is
  # exactly that as long as the count is meant to grow. Per control is stable
  # across every run above, at three different counts.
  #
  # ⚠ AND THE PRICE IS NOT WHERE I FIRST PUT IT. This job roughly doubled when
  # the harness moved into a throwaway clone, and the clone was the visible new
  # thing, so the clone is what I wrote down. The fourteen-control figure this
  # comment used to carry -- 130-157s across six runs on 2026-08-26, the slow end
  # being run 33005583955 -- is 9.3 to 11.2s per control, the same band or
  # slightly worse. The clone did not make the gate more expensive: the job grew
  # because the
  # CONTROL COUNT doubled, and the visible change was not the responsible one.
  #
  # The SLOW END is what the bound is argued from, deliberately. A number
  # justifying a bound has to be argued from the side the risk is on, and for a
  # timeout the risk is overrun -- so the fast end, though equally true and
  # equally citable, argues in the wrong direction. A snapshot, not a definition:
  # both factors move, one with the runner and one with this file.
  #
  # What the bound means in the unit that actually grows: at the slow end of the
  # two bands recorded here (11.2s), ten minutes is reached at about FIFTY
  # controls; at today's (7.9-9.8s), sixty to seventy-five. Fifty is the number
  # to plan against, and this harness is at 35 controls.
  # Sharing public-surface's five-minute budget would have put it past half of that
  # on day one, and the failure mode of outgrowing a timeout is a cancelled job
  # that reads like an outage rather than like a check that got too expensive.
  # Separate clock, stated size.
  lane-b-ratchet-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A green gate says nothing about whether its checks still EXIST: two of
      # this ratchet's review findings were checks that had been correct two
      # rounds earlier and were dropped in a restructure, and both survived a
      # green run of the gate itself. This drives each refusal to its condition
      # and fails when one stops firing. No network, no history depth: every
      # comparison target is synthesized from HEAD.
      - name: Every lane B refusal still fires
        run: ./scripts/test_lane_b_ratchet.sh

  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No fetch-depth here on purpose. The gate's roster rule now asks whether
      # each literal still appears in the TRACKED TREE, which a one-commit clone
      # answers perfectly well — the earlier `fetch-depth: 0` existed only for
      # the history-based version of that rule and was pure cost once the rule
      # changed. Verified by cloning this branch with --depth 1 and running the
      # gate: exit 0.
      - name: Checkout
        uses: actions/checkout@v7

      # This repository is already public, so it is NOT in the org's
      # publication-candidate list and nothing else scans it. See the script's
      # header for what the two lanes do and do not cover.
      # One extra commit, not a full history: the lane B ratchet compares this
      # tree's baseline against an EARLIER one, so that raising a number in the
      # same change that adds the occurrence is caught.
      #
      # ⚠ THREE CASES, AND EACH NEEDED ITS OWN ANSWER.
      #
      # pull_request: fetch the event's IMMUTABLE base sha, not the branch NAME.
      #   A refspec resolves in the remote at fetch time, so if the base branch
      #   pays lane B debt between the event and this job, the checked-out
      #   merge commit would be compared against a newer, smaller baseline and
      #   an untouched PR would fail. The event's base.sha is the snapshot the
      #   event was built from and cannot move under us.
      #
      # push to an existing ref: github.event.before is the pre-push tip.
      #
      # push CREATING a ref: COMPARE AGAINST THE DEFAULT BRANCH.
      #
      #   I removed this arm once, arguing "a branch is not a publication" and
      #   that a new ref reaches main only through the other two arms. THE
      #   HEADER OF THIS FILE SAYS OTHERWISE, three lines from where I was
      #   editing: "This repository is PUBLIC: a branch pushed here is readable
      #   the moment it lands, whether or not a pull request ever opens", and
      #   tags are "the artifact people install, and one release here was cut
      #   off-main". Publication is not reaching main. It is being readable.
      #
      #   `before` is all zeros here, and the pushed commit's own parent is not a
      #   baseline either -- on a branch publishing several commits it is itself
      #   newly published. So the comparison is against the DEFAULT BRANCH: a ref
      #   that certainly exists, certainly is published, and answers the question
      #   this arm actually asks -- does this ref expose more internal material
      #   than what is already public?
      #
      #   A branch cut from an older main can fail here after main pays debt. That
      #   is a false alarm with an obvious remedy (rebase, or regenerate), and it
      #   is the cheaper error: the alternative was publishing unreviewed material
      #   with a green tick.
      - name: Fetch the comparison base for the lane B ratchet
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          before='${{ github.event.before }}'
          zero='0000000000000000000000000000000000000000'
          if [ -n "$base_sha" ]; then
            git fetch --depth=1 origin "$base_sha"
            echo "SP_LANE_B_BASE=FETCH_HEAD" >> "$GITHUB_ENV"
          elif [ -n "$before" ] && [ "$before" != "$zero" ]; then
            git fetch --depth=1 origin "$before"
            echo "SP_LANE_B_BASE=FETCH_HEAD" >> "$GITHUB_ENV"
          else
            git fetch --depth=1 origin "${{ github.event.repository.default_branch }}"
            echo "SP_LANE_B_BASE=FETCH_HEAD" >> "$GITHUB_ENV"
          fi

      - name: No internal material in the published non-source surface
        run: ./scripts/check_public_surface.sh
        env:
          PUBLIC_SURFACE_BASE_REF: ${{ env.SP_LANE_B_BASE }}



