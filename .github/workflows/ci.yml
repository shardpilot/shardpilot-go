name: ci

on:
  pull_request:
  # ⚠ EVERY PUSH, NOT ONLY main. This repository is PUBLIC: a branch pushed here
  # is readable the moment it lands, whether or not a pull request ever opens.
  # A `branches: [main]` filter meant the secret scan and the publication gate
  # skipped exactly the case where the contents are already exposed and nobody
  # is looking. Tags are included for the same reason and a stronger one — a tag
  # is the artifact people install, and one release here was cut off-main.
  #
  # No job is conditioned to narrow this back down. A condition is how a gate
  # stops running without anyone noticing, which is the failure being fixed; the
  # cost of running the rest of the suite on a branch push is CI minutes.
  push:

# ⚠ NO WORKFLOW-LEVEL CONCURRENCY, DELIBERATELY. `cancel-in-progress` at this
# level cancels the run for a superseded push — which is exactly the disclosure
# case: a branch pushed with a credential and force-pushed a minute later. The
# cancelled run never scanned the commit that was public, and the replacement
# run checks out history in which that commit is no longer reachable, so not
# even the `--log-opts=--all` pass can reach it. Cancelling a security scan on
# the grounds that a newer commit exists is cancelling it for the one push that
# mattered.
#
# So the publication-sensitive jobs carry no concurrency group at all and always
# run to completion. The rest opt in per job, keyed by job as well as ref so
# they do not queue behind one another.

jobs:
  # Workspace security baseline, mirroring the pattern the other SDK
  # repositories already run (godot/unity/unreal/cli). Both passes: the working
  # tree and the full history across all refs, so a secret can neither live at
  # HEAD nor hide in an earlier commit. Exact-pinned image.
  #
  # There IS a .gitleaks.toml here, and it carries no `paths` clause on purpose:
  # measured against v8.30.1, an allowlist with `paths` excuses the whole FILE
  # even with condition = "AND", and the files needing exceptions are test files
  # — the likeliest place for a pasted credential. Exceptions name the literal.
  #
  # ⚠ THIS REPOSITORY IS PUBLIC, which inverts the usual urgency. Everywhere
  # else a missing secret scan is a gap to close before a visibility flip; here
  # a credential is exposed at the moment it is pushed. It was measured on
  # 2026-08-20 that this was one of only two candidate repositories running no
  # secret scanner at all — and the only two already public.
  #
  # fetch-depth: 0 is required by the history pass and by nothing else in this
  # workflow.
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan working tree for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: dir --verbose --redact /github/workspace

      - name: Scan git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git --verbose --redact --log-opts=--all /github/workspace
  go:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.25.x'
          - '1.27.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  # gofmt is checked ONCE, on the newest toolchain this repo tests, and
  # deliberately NOT inside the version matrix.
  #
  # gofmt's output changes between Go releases: 1.27 de-indents the
  # continuation lines of a multi-value return whose operands are composite
  # literals, which 1.25 indents. A source file therefore cannot satisfy
  # 1.25's gofmt and 1.27's at the same time, and running the check on every
  # matrix leg asserts precisely that impossibility — it turned this workflow
  # red the moment 1.27.x joined the matrix.
  #
  # The newest toolchain wins because that is what contributors have installed.
  # Formatting is not a compatibility constraint: it has no bearing on what the
  # 1.25 baseline can compile, which is what the matrix is actually for.
  format:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  release-consistency:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version consistency (README latest tag == CHANGELOG head == skill pin)
        run: ./scripts/check_release_consistency.sh

  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # No fetch-depth here on purpose. The gate's roster rule now asks whether
      # each literal still appears in the TRACKED TREE, which a one-commit clone
      # answers perfectly well — the earlier `fetch-depth: 0` existed only for
      # the history-based version of that rule and was pure cost once the rule
      # changed. Verified by cloning this branch with --depth 1 and running the
      # gate: exit 0.
      - name: Checkout
        uses: actions/checkout@v7

      # This repository is already public, so it is NOT in the org's
      # publication-candidate list and nothing else scans it. See the script's
      # header for what the two lanes do and do not cover.
      - name: No internal material in the published non-source surface
        run: ./scripts/check_public_surface.sh
