# gitleaks configuration for shardpilot-go.
#
# Credential-shaped examples are allowed by their exact anchored value, not
# by their containing file. Keep other rules scanning the same files. A path
# condition is not a blanket exemption for every rule: its scope depends on
# the allowlist condition and targetRules. The separate synthetic UUID pattern
# below describes identifiers, which authenticate nothing.
#
# Test a credential-shaped fixture against defaults first: a fixture already
# excused upstream cannot establish that this configuration detects it.
[extend]
useDefault = true

[[allowlists]]
description = """
A JWT-SHAPED string built by the crash-symbol sanitiser's own test. Its payload
is base64 for {"sub":"test"}; the test asserts that this exact shape does NOT
survive sanitisation, so it would be pointless with anything else.

UUIDv7 actor identifiers used as test constants. An anonymous id is a
pseudonymous actor key, not a credential — it authenticates nothing — and both
are visibly synthetic (the second ends in twelve f's).
"""
regexes = [
  '''^header\.eyJzdWIiOiJ0ZXN0In0\.signature$''',
  '''0198f2c1-4b3a-7c2d-8e9f-[0-9a-f]{12}''',
]
